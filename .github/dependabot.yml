version: 2
updates:
  # Maintain dependencies for the codebase
  - package-ecosystem: "gomod"
    target-branch: "main"
    directories:
      - "/"
      - "/manual_tests"
      - "/examples/complex_wallet_examples/certifier_server_example"
      - "/examples/complex_wallet_examples/create_faucet_server"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    groups:
      go_modules:
        update-types:
          - "minor"
          - "patch"
          - "major"

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    target-branch: "main"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    groups:
      gh_actions:
        update-types:
          - "minor"
          - "patch"
          - "major"
