sonar.cpd.exclusions=**/*_test.go,**/testabilities/**,**/fixtures/**,**/tools/**,**/examples/**,**/mocks/**,**/manual_tests/**,**/genquery/**

# Ignore "Hardcoded credentials" (go:S2068 and similar secret rules) for conformance test vectors and test code.
# All flagged Bearer tokens and hex values are fake/public test data required to drive the ts-stack conformance harness.
# See .gitleaksignore for the equivalent Gitleaks false-positive markings.
sonar.issue.ignore.multicriteria=cred1,cred2,cred3
sonar.issue.ignore.multicriteria.cred1.ruleKey=go:S2068
sonar.issue.ignore.multicriteria.cred1.resourceKey=**/conformance/**

sonar.issue.ignore.multicriteria.cred2.ruleKey=go:S2068
sonar.issue.ignore.multicriteria.cred2.resourceKey=**/*conformance*_test.go

sonar.issue.ignore.multicriteria.cred3.ruleKey=go:S2068
sonar.issue.ignore.multicriteria.cred3.resourceKey=pkg/storage/v1adapter/handler.go
