sonar.cpd.exclusions=**/*_test.go,**/testabilities/**,**/fixtures/**,**/tools/**,**/examples/**,**/mocks/**,**/manual_tests/**,**/genquery/**

# Ignore "Hardcoded credentials" (go:S2068 and similar secret rules) for conformance test vectors and test code.
# All flagged Bearer tokens and hex values are fake/public test data required to drive the ts-stack conformance harness.
# See .gitleaksignore for the equivalent Gitleaks false-positive markings.
sonar.issue.ignore.multicriteria=cred1,cred2,cred3,sec1,sec2,sec3,sec4
sonar.issue.ignore.multicriteria.cred1.ruleKey=go:S2068
sonar.issue.ignore.multicriteria.cred1.resourceKey=**/conformance/**

sonar.issue.ignore.multicriteria.cred2.ruleKey=go:S2068
sonar.issue.ignore.multicriteria.cred2.resourceKey=**/*conformance*_test.go

sonar.issue.ignore.multicriteria.cred3.ruleKey=go:S2068
sonar.issue.ignore.multicriteria.cred3.resourceKey=pkg/storage/v1adapter/handler.go

# secrets:S8217 (Bearer Authentication token) – same test-data exclusions as S2068.
# All Bearer tokens flagged here are public test fixtures used by the BRC-100 / storage
# adapter conformance harness; they are not real credentials.
sonar.issue.ignore.multicriteria.sec1.ruleKey=secrets:S8217
sonar.issue.ignore.multicriteria.sec1.resourceKey=**/conformance/**

sonar.issue.ignore.multicriteria.sec2.ruleKey=secrets:S8217
sonar.issue.ignore.multicriteria.sec2.resourceKey=**/*conformance*_test.go

sonar.issue.ignore.multicriteria.sec3.ruleKey=secrets:S8217
sonar.issue.ignore.multicriteria.sec3.resourceKey=pkg/storage/v1adapter/handler.go

# Broad fallback for the adapter-conformance vector file (pure test data).
sonar.issue.ignore.multicriteria.sec4.ruleKey=secrets:S8217
sonar.issue.ignore.multicriteria.sec4.resourceKey=**/adapter-conformance.json
