sonar.go.coverage.reportPaths=coverage.out
sonar.go.golangci-lint.reportPaths=golangci-lint-report.xml
sonar.externalIssuesReportPaths=sonar_filename_report.json

sonar.exclusions=**test**,**/docs/**,**vendor**,services/legacy/**,ui/**,ui_v2/**,**/*.pb.go,**/mock.go,**/Mock.go,**/interface.go,**/Interface.go
sonar.coverage.exclusions=**/testabilities/**,**/fixtures/**,**/tools/**,**/examples/**,**/mocks/**,**/cmd/**

# this excludes files for "copy paste detection" (CPD)
sonar.cpd.exclusions=**/*_test.go,**/testabilities/**,**/fixtures/**,**/tools/**,**/examples/**,**/mocks/**

sonar.tests=.
sonar.test.inclusions=**/*_test.go
