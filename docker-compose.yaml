services:
  jaeger:
    image: jaegertracing/all-in-one:1.35
    profiles: ["tracing"]
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - OTEL_EXPORTER_OTLP_INSECURE=true

  db:
    image: postgres:17-alpine
    volumes:
      - db-data:/var/lib/postgresql/data:Z
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=storage
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d storage"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Optional shared cache store (see "Cache store" in README.md). Uncomment this service,
  # the redis entry under infra.depends_on and the INFRA_CACHE_* variables under
  # infra.environment. Without it infra caches in memory.
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "127.0.0.1:6379:6379"
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5

  infra:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
        # redis:
        #   condition: service_healthy
    ports:
      - "8100:8100"
    volumes:
      # Mount your own config to override the defaults:
      #   ./infra-config.docker.yaml:/app/infra-config.yaml:ro
      - ./infra-config-docker.yaml:/app/infra-config.yaml:ro
    restart: unless-stopped
    # Optional: increase max body size further via env if you extend the app to read it
    # environment:
    #   - MAX_REQUEST_BODY_BYTES=524288000   # 500 MiB
    #   - INFRA_CACHE_TYPE=redis
    #   - INFRA_CACHE_REDIS_URL=redis://redis:6379/0

volumes:
  db-data:
    driver: local

