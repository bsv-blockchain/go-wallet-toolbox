background_broadcaster:
  channel_size: 0
  workers: 0
bsv_network: main
change_basket:
  max_change_outputs_per_tx: 8
  minimum_desired_utxo_value: 1000
  number_of_desired_utxos: 32
commission:
  pub_key_hex: ""
  satoshis: 0
db:
  engine: sqlite
  max_connection_idle_time: 6m0s
  max_connection_time: 1m0s
  max_idle_connections: 5
  max_open_connections: 5
  mysql:
    db_name: storage
    host: localhost
    password: ""
    port: "3306"
    protocol: tcp
    time_zone: UTC
    user: root
  postgresql:
    db_name: storage
    host: localhost
    password: <set-via-secret>
    port: "5432"
    schema: ""
    ssl_mode: verify-full
    time_zone: UTC
    user: postgres
  sqlite:
    connection_string: ./storage.sqlite
fail_abandoned:
  min_transaction_age_seconds: 300
fee_model:
  type: sat/kb
  value: 100
http:
  cors:
    allow_all_origins: true
    allow_private_network: true
    allowed_headers:
      - content-type
      - authorization
      - x-bsv-auth-version
      - x-bsv-auth-message-type
      - x-bsv-auth-identity-key
      - x-bsv-auth-nonce
      - x-bsv-auth-your-nonce
      - x-bsv-auth-signature
      - x-bsv-auth-request-id
      - x-bsv-auth-requested-certificates
      - X-BSV-Payment
    allowed_methods:
      - POST
    allowed_origins: []
    enabled: true
    exposed_headers:
      - authorization
      - x-bsv-auth-version
      - x-bsv-auth-message-type
      - x-bsv-auth-identity-key
      - x-bsv-auth-nonce
      - x-bsv-auth-your-nonce
      - x-bsv-auth-signature
      - x-bsv-auth-request-id
      - X-BSV-Payment-Version
      - X-BSV-Payment-Satoshis-Required
      - X-BSV-Payment-Satoshis-Paid
      - X-BSV-Payment-Derivation-Prefix
  max_request_body_bytes: 1048576
  port: 8100
  request_price: 0
logging:
  enabled: true
  handler: json
  level: info
monitor:
  enabled: true
  events:
    tx_broadcasted:
      channel_size: 100
      enabled: false
    tx_proven:
      channel_size: 100
      enabled: false
  tasks:
    check_for_proofs:
      enabled: true
      interval_seconds: 60
      start_immediately: false
    fail_abandoned:
      enabled: true
      interval_seconds: 300
      start_immediately: false
    send_waiting:
      enabled: true
      interval_seconds: 300
      start_immediately: true
    un_fail:
      enabled: true
      interval_seconds: 600
      start_immediately: false
name: go-storage-server
observability:
  metrics:
    enabled: false
    export_interval_seconds: 15
server_private_key: ""
synchronize_tx_statuses:
  blocks_delay: 1
  check_no_send_period_hours: 24
  max_attempts: 100
  max_rebroadcast_attempts: 0
tracing:
  dialAddr: http://localhost:4317
  enabled: false
  sample: 100
utxo_management:
  strategy: privacy
  throughput:
    consolidation_inputs_per_tx: 1000
    denomination_satoshis: 0
    expected_confirmation_seconds: 300
    expected_output_satoshis: 170
    expected_tx_size_bytes: 668
    fanout_max_txs_per_round: 12000
    fanout_outputs_per_tx: 100
    fanout_tree_depth: 2
    high_water_percent: 100
    low_water_percent: 60
    pool_basket: fuel
    pool_headroom_factor: 1.5
    reserve_basket: reserve
    spend_policy: prefer_mined
    target_pool_size: 0
    target_tps: 10000
    top_up:
      enabled: true
      interval_seconds: 10
      start_immediately: true
wallet_services:
  arc:
    callback_token: ""
    callback_url: ""
    deployment_id: ""
    enabled: true
    token: mainnet_abc
    url: https://arc.taal.com
    wait_for: ""
  bhs:
    api_key: ""
    enabled: false
    url: http://localhost:8080
  bitails:
    api_key: ""
    enabled: false
    script_hash_history_page_limit: 100
  chaintracks:
    bootstrap_mode: ""
    bootstrap_url: ""
    enabled: false
    mode: remote
    p2p_network: ""
    p2p_storage_path: ""
    remote_url: https://arcade-v2-us-1.bsvblockchain.tech/chaintracks
    storage_path: ""
  exchangerates_api_key: 123456
  fiat_exchange_rates:
    base: USD
    rates:
      EUR: 0.93
      GBP: 0.8
      USD: 1
    timestamp: {}
  fiat_update_interval: 24h0m0s
  get_beef_max_depth: 100
  whats_on_chain:
    api_key: ""
    bsv_exchange_rate:
      base: USD
      rates: 47.52
      timestamp: {}
    bsv_update_interval: 15m0s
    enabled: true
    root_for_height_retries: 3
    root_for_height_retry_interval: 1s
